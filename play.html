<script>
(function () {
  var id = location.hash.replace(/^#/, '');
  var std = {};
  (window.CX_STANDARDS || []).forEach(function (s) { std[s.id] = s; });
  var room = (window.CX_ROOMS || []).filter(function (r) { return r.id === id; })[0];
  var app = document.getElementById('app');
  if (!room) { app.innerHTML = '<p class="missing">This room link is missing its room name. Ask your teacher for a new link.</p>'; return; }
  var s = std[room.std] || {};
  room.grade = s.grade; room.subject = s.subject; room.standard = s.code;
  document.title = room.title;
  EscapePlayer(app, room);
})();
</script>
