<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Sheet · Sunnyside Simulators</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">
<style>
:root { --ink: #1d2433; --muted: #5b6474; --line: #9aa3b2; --acc: #1d2433; }
* { box-sizing: border-box; }
body { margin: 0; background: #e9e5da; color: var(--ink); font: 15px/1.45 "Atkinson Hyperlegible", system-ui, sans-serif; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 12px 16px; background: #111114; border-bottom: 4px solid #c1121f; }
.bar a, .bar button { font: 700 14px inherit; font-family: inherit; color: #fff; background: #c1121f; border: 0; border-radius: 10px; padding: 8px 14px; text-decoration: none; cursor: pointer; }
.bar a.alt { background: #fff; color: #111114; }
.page { width: min(8.5in, 100% - 32px); margin: 16px auto 40px; background: #fff; padding: .55in .6in; box-shadow: 0 6px 24px rgba(0,0,0,.15); }
h1 { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 26px; margin: 0; line-height: 1.15; }
.kicker { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--acc); }
.who { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin: 12px 0; font-size: 14px; }
.who span { border-bottom: 1.5px solid var(--ink); padding-bottom: 14px; }
.lvl { display: flex; gap: 16px; font-size: 14px; margin-bottom: 8px; flex-wrap: wrap; }
.lvl i { display: inline-block; width: 14px; height: 14px; border: 1.5px solid var(--ink); border-radius: 50%; vertical-align: -2px; margin-right: 4px; }
.mission { border-left: 5px solid var(--acc); background: #f6f4ee; padding: 8px 12px; margin: 8px 0; }
.box { border: 1.5px solid var(--ink); border-radius: 10px; padding: 8px 12px 10px; margin: 10px 0; break-inside: avoid; }
.box h2 { font-size: 15px; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; }
.num { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--acc); color: #fff; display: grid; place-items: center; font-size: 13px; }
.item { margin: 6px 0 2px; }
.item .tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.leg { font-size: 11px; font-weight: 700; color: #7a5a00; background: #fff3bf; border-radius: 6px; padding: 1px 6px; margin-left: 6px; }
.lines div { height: 26px; border-bottom: 1px solid var(--line); }
.choices { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 3px 0; font-size: 14px; }
.choices span::before { content: "○ "; }
table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 4px 0; }
th, td { border: 1px solid var(--ink); padding: 4px 6px; text-align: left; vertical-align: top; }
td.blank { height: 30px; }
.vocab td:first-child { font-weight: 700; width: 28%; }
.code { display: flex; gap: 14px; align-items: center; border: 2.5px dashed var(--ink); border-radius: 12px; padding: 10px 14px; margin-top: 12px; break-inside: avoid; }
.code b { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 18px; }
.code .cbox { flex: 1; height: 38px; border: 1.5px solid var(--ink); border-radius: 8px; }
.ans { color: #b3261e; font-weight: 700; }
.key .ans { display: inline; }
.note { font-size: 12px; color: var(--muted); }
@media print { body { background: #fff; } .bar { display: none; } .page { width: auto; margin: 0; box-shadow: none; padding: 0; } @page { margin: .5in; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="js/sim.js"></script>
<script src="data/standards.js"></script>
<script src="data/sims-g5-science.js"></script>
<script src="data/sims-g6-science.js"></script>
<script src="data/sims-g5-math.js"></script>
<script src="data/sims-g6-math.js"></script>
<script src="data/sims-g5-ela.js"></script>
<script src="data/sims-g6-ela.js"></script>
<script src="data/sims-g5-social.js"></script>
<script src="js/sheet.js"></script>
</body>
</html>
